# 公開：main に push したら、テストと check-code が通ったときだけ Pages に出す（中身は Q 共通の q-pages.yml）
# ?v= は公開のときに付くので、手で付けなくてよい
name: 公開

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 */3 * * *" # 3時間ごとの見回り：Q キットだけ新しくなったら出しなおす

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    uses: katsuan/oqrn/.github/workflows/q-pages.yml@main
    secrets: inherit # テストは公開しない所にある（Q_DEV_KEY で読む）
    with:
      dev: true
      folder: q-soraqru
